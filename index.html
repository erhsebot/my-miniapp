<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>راهنمای خاموش‌کننده</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --tx:var(--tg-theme-text-color,#1b1b1b);
  --hint:var(--tg-theme-hint-color,#6b6b6b);
  --card:var(--tg-theme-secondary-bg-color,#f2f2f4);
  --btn:var(--tg-theme-button-color,#c8102e);
  --btn-tx:var(--tg-theme-button-text-color,#ffffff);
  --red:#c8102e;
  --line:rgba(128,128,128,.28);
  font-family:"Vazirmatn",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--tx);line-height:1.9;font-size:15px}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;font-weight:800;margin:0 0 4px}
h2{font-size:16px;font-weight:800;margin:0 0 8px}
.sub{color:var(--hint);margin:0 0 18px;font-size:13px}
.bar{height:5px;background:var(--red);border-radius:3px;width:56px;margin-bottom:12px}
label,.lab{display:block;font-weight:600;margin:16px 0 6px}
select,input{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.help{color:var(--hint);font-size:13px;margin:6px 0 0}
.chips{display:grid;gap:8px}
.chip{display:flex;align-items:center;gap:10px;text-align:right;font:inherit;color:var(--tx);background:var(--card);border:2px solid transparent;border-radius:12px;padding:10px 12px;cursor:pointer;width:100%}
.chip[aria-pressed="true"]{border-color:var(--red)}
.chip b{display:block;font-size:14px}
.chip small{color:var(--hint);font-size:12px;line-height:1.6}
.sym{flex:none;width:34px;height:34px;display:block}
.sA{background:#1a9b4b;clip-path:polygon(50% 5%,95% 92%,5% 92%)}
.sB{background:#d62828;clip-path:polygon(12% 12%,88% 12%,88% 88%,12% 88%)}
.sC{background:#1f6fd1;border-radius:50%;transform:scale(.82)}
.sD{background:#e8b400;clip-path:polygon(50% 2%,62% 36%,98% 38%,70% 60%,80% 96%,50% 75%,20% 96%,30% 60%,2% 38%,38% 36%)}
.sK{background:#333;clip-path:polygon(25% 8%,75% 8%,98% 50%,75% 92%,25% 92%,2% 50%)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.go{margin-top:22px;width:100%;font:inherit;font-weight:800;font-size:16px;border:0;border-radius:12px;padding:14px;background:var(--btn);color:var(--btn-tx);cursor:pointer}
button.alt{font:inherit;font-weight:600;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:transparent;color:var(--tx);cursor:pointer;margin-top:10px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
#out{margin-top:26px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:30px;font-weight:800;color:var(--red);line-height:1.3}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px;font-weight:600;direction:ltr;unicode-bidi:isolate}
ul{margin:6px 0 0;padding:0 18px}
li{margin-bottom:4px}
.warn{border-right:5px solid var(--red)}
.note{color:var(--hint);font-size:12.5px}
details{margin-top:14px}
summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<main>
  <div class="bar"></div>
  <h1>راهنمای خاموش‌کننده</h1>
  <p class="sub">انتخاب نوع، تعداد و محل نصب خاموش‌کننده برای هر مکان، بر پایه استاندارد NFPA 10</p>

  <label for="place">مکان شما چیست؟</label>
  <select id="place"></select>

  <label for="hazard">میزان خطر آتش‌سوزی</label>
  <select id="hazard"></select>
  <p class="help" id="hazardHelp"></p>

  <div class="lab">چه چیزهایی در آن مکان هست؟ (چند مورد را می‌توانید انتخاب کنید)</div>
  <div class="chips" id="chips"></div>

  <div class="row">
    <div><label for="area">مساحت هر طبقه (متر مربع)</label>
    <input id="area" type="text" inputmode="decimal" placeholder="مثلاً ۸۰"></div>
    <div><label for="floors">تعداد طبقه</label>
    <input id="floors" type="text" inputmode="numeric" value="1"></div>
  </div>

  <details>
    <summary>تنظیمات پیشرفته</summary>
    <label for="rate">رتبه A روی برچسب خاموش‌کننده‌ای که دارید یا می‌خرید</label>
    <select id="rate">
      <option value="0">نمی‌دانم (حداقل لازم را حساب کن)</option>
      <option value="2">2-A</option><option value="3">3-A</option><option value="4">4-A</option>
      <option value="6">6-A</option><option value="10">10-A</option>
    </select>
  </details>

  <button class="go" id="go">محاسبه کن</button>
  <div id="out" aria-live="polite"></div>
</main>

<script>
/* ===== داده‌های استاندارد: برای تطبیق با متن NFPA 10:2026 فقط همین بخش را اصلاح کنید ===== */
const DATA = {
  ft: 0.3048,
  maxAreaPerUnit_m2: 1045,          // سقف مساحت زیر پوشش هر خاموش‌کننده (کلاس A)
  travelA_m: 22.9,                  // حداکثر مسافت پیمایش کلاس A
  travelBnear_m: 9.1, travelBfar_m: 15.2,
  travelD_m: 22.9, travelK_m: 9.1,
  mount: { upTo40lb_m: 1.53, over40lb_m: 1.07, floorGap_cm: 10 },
  hazard: {
    light:   { name:'کم', help:'مواد قابل اشتعال کم است؛ مثل خانه، اداره، مدرسه، مطب، هتل.', minA:2, areaPerA_m2:279, bFar:10 },
    ordinary:{ name:'متوسط', help:'مواد قابل اشتعال متوسط است؛ مثل مغازه، رستوران، کارگاه سبک، پارکینگ، تعمیرگاه.', minA:2, areaPerA_m2:139, bFar:20 },
    extra:   { name:'زیاد', help:'مواد قابل اشتعال زیاد یا آتش سریع‌گسترش است؛ مثل انبار مواد، رنگ‌کاری، کارگاه چوب با خاک اره زیاد، مواد شیمیایی.', minA:4, areaPerA_m2:93, bFar:80 }
  },
  classes: {
    A:{ t:'کلاس A: جامدات', d:'چوب، کاغذ، پارچه، پلاستیک، مبلمان' },
    B:{ t:'کلاس B: مایعات و گازهای قابل اشتعال', d:'بنزین، حلال، رنگ، روغن موتور، گاز' },
    C:{ t:'کلاس C: وسایل برقی روشن', d:'تابلو برق، دستگاه، کابل، موتور برقی' },
    D:{ t:'کلاس D: فلزات قابل اشتعال', d:'منیزیم، تیتانیوم، پودر آلومینیوم، سدیم' },
    K:{ t:'کلاس K: روغن و چربی پخت‌وپز', d:'سرخ‌کن، گریل، دیگ روغن، آشپزخانه تجاری' }
  },
  places: [
    { id:'home', n:'خانه یا آپارتمان', hz:'light', cl:['A','B','C'] },
    { id:'office', n:'اداره، مدرسه، مطب', hz:'light', cl:['A','C'] },
    { id:'shop', n:'مغازه یا فروشگاه', hz:'ordinary', cl:['A','C'] },
    { id:'kitchen', n:'رستوران یا آشپزخانه تجاری', hz:'ordinary', cl:['A','C','K'] },
    { id:'garage', n:'پارکینگ یا تعمیرگاه خودرو', hz:'ordinary', cl:['A','B','C'] },
    { id:'workshop', n:'کارگاه (نجاری، جوشکاری، مکانیکی)', hz:'ordinary', cl:['A','B','C'] },
    { id:'store', n:'انبار یا مکان با مواد زیاد', hz:'extra', cl:['A','B','C'] },
    { id:'metal', n:'کارگاه فلزکاری با فلزات واکنش‌پذیر', hz:'extra', cl:['A','C','D'] },
    { id:'other', n:'مکان دیگر (خودم انتخاب می‌کنم)', hz:'ordinary', cl:['A','C'] }
  ],
  inspect: [
    'بازرسی چشمی ماهانه: وجود در جای خود، دسترسی آزاد، عقربه فشارسنج در ناحیه سبز، پین و مهر سالم.',
    'سرویس و بازرسی فنی سالانه توسط فرد صلاحیت‌دار.',
    'آزمون هیدرواستاتیک و شارژ مجدد طبق نوع و تاریخ روی برچسب.',
    'در ویرایش ۲۰۲۶ پایش الکترونیکی می‌تواند جایگزین بازرسی چشمی شود، به شرط تأیید مرجع ذی‌صلاح.'
  ]
};
/* ===== پایان داده‌ها ===== */

try{ const tg=window.Telegram.WebApp; tg.ready(); tg.expand(); }catch(e){}

const $=id=>document.getElementById(id);
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]).replace('.','٫');
const norm=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace('٫','.').replace(',','.').trim();
const sel=new Set();

DATA.places.forEach(p=>{ const o=document.createElement('option'); o.value=p.id; o.textContent=p.n; $('place').appendChild(o); });
Object.entries(DATA.hazard).forEach(([k,v])=>{ const o=document.createElement('option'); o.value=k; o.textContent=v.name; $('hazard').appendChild(o); });

Object.entries(DATA.classes).forEach(([k,v])=>{
  const b=document.createElement('button'); b.type='button'; b.className='chip'; b.dataset.k=k; b.setAttribute('aria-pressed','false');
  b.innerHTML='<span class="sym s'+k+'"></span><span><b>'+v.t+'</b><small>'+v.d+'</small></span>';
  b.onclick=()=>{ sel.has(k)?sel.delete(k):sel.add(k); paint(); };
  $('chips').appendChild(b);
});
function paint(){ document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',sel.has(c.dataset.k))); $('hazardHelp').textContent=DATA.hazard[$('hazard').value].help; }
function applyPlace(){ const p=DATA.places.find(x=>x.id===$('place').value); $('hazard').value=p.hz; sel.clear(); p.cl.forEach(c=>sel.add(c)); paint(); }
$('place').onchange=applyPlace; $('hazard').onchange=paint; applyPlace();

function calc(){
  const out=$('out');
  const area=parseFloat(norm($('area').value)); const floors=Math.max(1,parseInt(norm($('floors').value))||1);
  if(!(area>0)){ out.innerHTML='<div class="card warn">مساحت را به متر مربع وارد کنید.</div>'; return; }
  if(sel.size===0){ out.innerHTML='<div class="card warn">دست‌کم یک مورد از فهرست «چه چیزهایی در آن مکان هست؟» را انتخاب کنید.</div>'; return; }
  const H=DATA.hazard[$('hazard').value]; const hasA=sel.has('A'), hasB=sel.has('B'), hasC=sel.has('C'), hasD=sel.has('D'), hasK=sel.has('K');
  const cover=r=>2*r*r; // مساحت مربع محافظه‌کارانه با شعاع مسافت پیمایش
  const lines=[]; const html=[]; let main=null;

  if(hasA||hasB||hasC){
    const rA=Math.max(H.minA,parseInt($('rate').value)||0);
    let cnt=1, parts=[], types='';
    if(hasA){ const byRate=Math.ceil(area/Math.min(rA*H.areaPerA_m2,DATA.maxAreaPerUnit_m2)); const byDist=Math.ceil(area/cover(DATA.travelA_m)); cnt=Math.max(cnt,byRate,byDist); parts.push(rA+'-A'); }
    if(hasB||(hasC&&!hasA)){ cnt=Math.max(cnt,Math.ceil(area/cover(DATA.travelBfar_m))); parts.push(H.bFar+'-B'); }
    if(hasC) parts.push('C');
    if(hasA&&!hasB&&!hasC) types='پودر شیمیایی ABC یا آب تحت فشار یا فوم';
    else if(!hasA&&(hasB||hasC)&&!(hasB&&hasC)) types=hasC?'CO₂ یا پودر BC/ABC یا گاز پاک (Clean agent)':'پودر BC/ABC یا CO₂ یا فوم';
    else types='پودر شیمیایی ABC (چندمنظوره، ساده‌ترین انتخاب)';
    const label=parts.join(':'); const total=cnt*floors;
    main={cnt,total,label,types};
    html.push('<div class="card"><h2>خاموش‌کننده اصلی</h2><div class="big">'+fa(cnt)+' عدد در هر طبقه</div><p>جمعاً '+fa(total)+' عدد برای '+fa(floors)+' طبقه</p><p>نوع: <b>'+types+'</b></p><p>حداقل رتبه روی برچسب: <span class="tag">'+label+'</span></p><p class="note">هر طبقه جداگانه حساب شده و حتی در مساحت کم، در هر طبقه دست‌کم یک عدد لازم است.</p></div>');
    lines.push('خاموش‌کننده اصلی: '+fa(cnt)+' عدد در هر طبقه (جمعاً '+fa(total)+')','نوع: '+types,'حداقل رتبه: '+label);
    const rules=[];
    if(hasA) rules.push('هیچ نقطه‌ای در طبقه نباید بیش از '+fa(DATA.travelA_m)+' متر مسیر پیمایش تا خاموش‌کننده کلاس A داشته باشد.');
    if(hasB) rules.push('برای مایعات قابل اشتعال: خاموش‌کننده با رتبه '+fa(H.bFar)+'-B تا '+fa(DATA.travelBfar_m)+' متر، و رتبه پایین‌تر فقط تا '+fa(DATA.travelBnear_m)+' متر کاربرد دارد.');
    if(hasC) rules.push('روی وسایل برقی روشن هرگز آب نزنید. از CO₂، پودر یا گاز پاک استفاده کنید.');
    html.push('<div class="card"><h2>فاصله تا خاموش‌کننده</h2><ul>'+rules.map(r=>'<li>'+r+'</li>').join('')+'</ul></div>');
    lines.push(...rules);
  }
  if(hasD){
    const t='پودر مخصوص کلاس D (نوع آن را با فلز موجود تطبیق دهید)';
    html.push('<div class="card warn"><h2>فلزات قابل اشتعال (کلاس D)</h2><ul><li>'+t+'، دست‌کم یک عدد برای هر محل کار با فلز.</li><li>حداکثر '+fa(DATA.travelD_m)+' متر تا محل خطر.</li><li>آب، فوم و پودر ABC روی آتش فلزات خطرناک است.</li></ul></div>');
    lines.push('کلاس D: '+t+'، حداکثر '+fa(DATA.travelD_m)+' متر تا محل خطر');
  }
  if(hasK){
    const t='شیمیایی مرطوب (Wet chemical) کلاس K';
    html.push('<div class="card warn"><h2>روغن پخت‌وپز (کلاس K)</h2><ul><li>'+t+'، دست‌کم یک عدد برای هر آشپزخانه یا گروه سرخ‌کن.</li><li>حداکثر '+fa(DATA.travelK_m)+' متر از محل پخت، و نه درست بالای آن.</li><li>هرگز روی روغن در حال سوختن آب نریزید.</li></ul></div>');
    lines.push('کلاس K: '+t+'، حداکثر '+fa(DATA.travelK_m)+' متر از محل پخت');
  }

  const m=DATA.mount;
  const place=[
    'در مسیر خروج و نزدیک درها، دور از خود منبع خطر نصب کنید تا برای برداشتن لازم نباشد به آتش نزدیک شوید.',
    'دسته خاموش‌کننده‌های تا ۱۸ کیلوگرم (۴۰ پوند) حداکثر '+fa(m.upTo40lb_m)+' متر از کف؛ سنگین‌تر از آن حداکثر '+fa(m.over40lb_m)+' متر.',
    'پایین خاموش‌کننده دست‌کم '+fa(m.floorGap_cm)+' سانتی‌متر از کف فاصله داشته باشد.',
    'جلوی آن را با کالا یا مبل نبندید، قفل نکنید و با تابلوی قابل‌دیدن مشخص کنید.',
    'دمای محل با محدوده دمایی روی برچسب مطابقت داشته باشد.'
  ];
  html.push('<div class="card"><h2>محل نصب</h2><ul>'+place.map(r=>'<li>'+r+'</li>').join('')+'</ul></div>');
  html.push('<div class="card"><h2>نگهداری</h2><ul>'+DATA.inspect.map(r=>'<li>'+r+'</li>').join('')+'</ul></div>');
  html.push('<div class="card"><h2>هنگام آتش‌سوزی</h2><ul><li>اول افراد را خارج کنید و با آتش‌نشانی (۱۲۵) تماس بگیرید.</li><li>فقط اگر آتش کوچک است و مسیر فرار پشت سرتان باز است، خاموش‌کننده را به کار ببرید.</li><li>روش کار: پین را بکشید، نازل را به ریشه آتش بگیرید، دسته را فشار دهید، از کنار به کنار جارو کنید.</li><li>آتش گاز را خاموش نکنید مگر جریان گاز قطع شود.</li></ul></div>');
  html.push('<p class="note">مبنا: آخرین نگارش NFPA 10 ویرایش ۲۰۲۶ است، ولی جدول‌های عددی این برنامه بر پایه نسخه‌های قبلی است و باید با متن ۲۰۲۶ و الزامات مرجع ذی‌صلاح محلی (مثل آتش‌نشانی و مقررات ملی ساختمان) تطبیق داده شود. این ابزار جایگزین طراحی و تأیید کارشناس ایمنی نیست.</p>');
  html.push('<button class="alt" id="copy">کپی خلاصه</button>');
  out.innerHTML=html.join('');
  const text=['خلاصه انتخاب خاموش‌کننده',DATA.places.find(x=>x.id===$('place').value).n+' | خطر '+H.name+' | '+fa(area)+' متر مربع | '+fa(floors)+' طبقه','کلاس‌ها: '+[...sel].join('، '),...lines,'مبنا: NFPA 10 (نیازمند تطبیق با ویرایش ۲۰۲۶ و مرجع محلی)'].join('\n');
  $('copy').onclick=async()=>{
    try{ await navigator.clipboard.writeText(text); }catch(e){ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    $('copy').textContent='کپی شد';
  };
  out.scrollIntoView({behavior:'smooth'});
}
$('go').onclick=calc;
</script>
</body>
</html>
